<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medication Reminder</title>

    <!-- Common team CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="medication-container">

        <!-- Page Header -->
        <div class="medication-header">
            <h1>💊 Medication Reminder</h1>
            <p>Manage your medicines and daily medication schedule.</p>
        </div>


        <!-- Add Medicine -->
        <div class="medicine-form-card">

            <h2>Add Medicine</h2>

            <form id="medicineForm">

                <div class="input-group">
                    <label for="medicineName">
                        Medicine Name
                    </label>

                    <input
                        type="text"
                        id="medicineName"
                        placeholder="Example: Paracetamol"
                        required
                    >
                </div>


                <div class="form-row">

                    <div class="input-group">
                        <label for="dosage">
                            Dosage
                        </label>

                        <input
                            type="text"
                            id="dosage"
                            placeholder="Example: 500 mg"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="medicineTime">
                            Time
                        </label>

                        <input
                            type="time"
                            id="medicineTime"
                            required
                        >
                    </div>

                </div>


                <div class="input-group">

                    <label for="frequency">
                        Frequency
                    </label>

                    <select id="frequency">

                        <option value="Daily">
                            Daily
                        </option>

                        <option value="Twice a day">
                            Twice a day
                        </option>

                        <option value="Weekly">
                            Weekly
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="add-medicine-button"
                >
                    + Add Medicine
                </button>

            </form>

        </div>


        <!-- Medicine List -->
        <div class="medicine-section">

            <h2>My Medicines</h2>

            <div id="medicineList">

                <div class="empty-message">
                    No medicines added yet.
                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="medications.js"></script>

</body>

</html>
