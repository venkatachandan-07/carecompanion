<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | CareCompanion</title>

    <link rel="stylesheet"
          href="./css/profile.css">

</head>

<body>

    <!-- HEADER -->

    <header class="profile-header">

        <button id="backBtn" class="back-btn">
            ← Back
        </button>

        <h1>My Profile</h1>

    </header>


    <!-- PROFILE CONTAINER -->

    <main class="profile-container">

        <!-- PROFILE CARD -->

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">
                User
            </h2>

            <p id="profileEmail">
                user@email.com
            </p>

        </section>


        <!-- ACCOUNT DETAILS -->

        <section class="details-card">

            <h2>Account Information</h2>


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="account-id">

                <span>Account ID</span>

                <strong id="userId">
                    -
                </strong>

            </div>


            <!-- BUTTONS -->

            <div class="profile-actions">

                <button
                    id="editBtn"
                    class="edit-btn">
                    ✏️ Edit Profile
                </button>

                <button
                    id="saveBtn"
                    class="save-btn">
                    💾 Save Changes
                </button>

            </div>

        </section>

    </main>


    <script src="./js/profile.js"></script>

</body>

</html>
